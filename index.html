<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUS 谱面分析器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f0f1e; color: #e0e0e0; min-height: 100vh; padding: 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header { text-align: center; padding: 16px 0 24px; }
  header h1 {
    font-size: 28px;
    background: linear-gradient(135deg, #7c4dff, #4fc3f7);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  header p { color: #888; margin-top: 6px; font-size: 14px; }
  /* 导入区 */
  #import-section { background: rgba(30,30,50,0.5); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  #drop-zone {
    border: 2px dashed #444; border-radius: 12px; padding: 28px; text-align: center;
    color: #888; margin-bottom: 14px; transition: all .2s; cursor: pointer;
  }
  #drop-zone.drag-over { border-color: #7c4dff; background: rgba(124,77,255,0.1); color: #7c4dff; }
  #paste-area {
    width: 100%; height: 110px; background: rgba(0,0,0,0.3); border: 1px solid #333;
    border-radius: 8px; color: #e0e0e0; padding: 10px; font-family: monospace; font-size: 12px; resize: vertical;
  }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button {
    padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px;
    cursor: pointer; transition: transform .12s, opacity .12s;
  }
  button:active { transform: scale(0.95); }
  #analyze-btn { background: linear-gradient(135deg, #7c4dff, #5e35b1); color: #fff; }
  #sample-btn { background: rgba(79,195,247,0.15); color: #4fc3f7; }
  #clear-btn { background: rgba(255,255,255,0.05); color: #888; }
  .notice { margin-top: 12px; padding: 8px 14px; border-radius: 8px; font-size: 13px; min-height: 20px; }
  .notice.error { background: rgba(255,82,82,0.15); color: #ff5252; }
  .notice.warn { background: rgba(255,193,7,0.15); color: #ffc107; }
  .notice.success { background: rgba(102,187,106,0.15); color: #66bb6a; }
  /* 结果区 */
  #results { display: none; }
  .panel { background: rgba(30,30,50,0.5); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
  .panel h3 { font-size: 14px; color: #888; margin-bottom: 10px; letter-spacing: 1px; }
  .meta-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 14px; }
  .meta-key { color: #aaa; }
  .meta-val { color: #e0e0e0; font-weight: 500; }
  #stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: rgba(30,30,50,0.5); border-radius: 12px; padding: 16px; text-align: center; }
  .stat-label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 700; }
  .stat-unit { font-size: 11px; color: #888; margin-left: 3px; }
  .chart-section { background: rgba(30,30,50,0.5); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .chart-section h3 { font-size: 14px; color: #888; margin-bottom: 10px; }
  .chart-controls { display: flex; gap: 8px; margin-bottom: 8px; }
  .chart-controls button { padding: 4px 14px; font-size: 13px; background: rgba(255,255,255,0.1); color: #e0e0e0; }
  canvas { width: 100%; height: 220px; display: block; }
  #density-chart { height: 260px; cursor: grab; }
  #density-chart:active { cursor: grabbing; }
  #details-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 700px) { #details-section { grid-template-columns: 1fr; } }
  .detail-item { padding: 5px 0; font-size: 13px; color: #ccc; }
  .detail-tag { display: inline-block; background: rgba(255,82,82,0.2); color: #ff5252; padding: 1px 8px; border-radius: 4px; margin-right: 6px; font-size: 12px; }
  .empty { color: #666; font-size: 13px; }
  /* 校准 → Combo 展示 */
  #calib-panel { background: rgba(30,30,50,0.5); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
  #calib-panel h3 { font-size: 14px; color: #888; margin-bottom: 10px; }
  #calib-display { font-size: 15px; }
  .combo-total { font-size: 18px; margin-bottom: 8px; }
  .combo-total b { color: #66bb6a; font-size: 28px; }
  .combo-breakdown { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .combo-part { background: rgba(102,187,106,0.15); color: #81c784; padding: 3px 10px; border-radius: 6px; font-size: 13px; }
  .combo-plus { color: #555; font-size: 14px; }
  .combo-source { color: #555; font-size: 11px; }
  .calib-hint { color: #666; font-size: 13px; }
  .stat-card-highlight { border: 1px solid rgba(102,187,106,0.4); box-shadow: 0 0 12px rgba(102,187,106,0.15); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>SUS 谱面分析器</h1>
    <p>上传 .sus 文件或粘贴文本，自动解析 Note 并可视化密度、难点段与双押</p>
  </header>

  <section id="import-section">
    <div id="drop-zone">拖拽 .sus 文件到此处，或点击选择文件</div>
    <input type="file" id="file-input" accept=".sus,.txt" style="display:none">
    <textarea id="paste-area" placeholder="或在此粘贴 SUS 文本…"></textarea>
    <div class="btn-row">
      <button id="analyze-btn">· 分析</button>
      <button id="sample-btn">√ 加载示例</button>
      <button id="clear-btn">✕ 清空</button>
    </div>
    <div class="notice" id="notice"></div>
  </section>

  <section id="results">
    <div class="panel" id="meta-panel"></div>
    <div id="stat-cards"></div>
    <div id="calib-panel">
      <h3>官方 Combo 自动计算</h3>
      <div id="calib-display"></div>
    </div>
    <div class="chart-section">
      <h3>Note 类型分布</h3>
      <canvas id="type-chart"></canvas>
    </div>
    <div class="chart-section">
      <h3>密度曲线（5 秒滑窗 · 红色高亮为难点段）</h3>
      <div class="chart-controls">
        <button id="zoom-in">＋ 放大</button>
        <button id="zoom-out">－ 缩小</button>
        <button id="zoom-reset">↺ 重置</button>
      </div>
      <canvas id="density-chart"></canvas>
    </div>
    <div id="details-section">
      <div class="panel" id="difficulty-panel"></div>
      <div class="panel" id="double-press-panel"></div>
      <div class="panel" id="slide-panel"></div>
    </div>
  </section>
</div>

<script src="js/utils/susParser.js"></script>
<script src="js/utils/stats.js"></script>
<script src="js/components/fileImport.js"></script>
<script src="js/components/statCards.js"></script>
<script src="js/components/details.js"></script>
<script src="js/components/charts.js"></script>
<script src="js/components/calibrationUI.js"></script>
<script src="js/hooks/analyzer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
